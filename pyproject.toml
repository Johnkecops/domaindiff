[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domaindiff"
version = "0.1.0"
description = "Compare two protein domain annotation runs of the same proteome"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arli Aditya Parikesit" }]
dependencies = []

[project.scripts]
domaindiff = "domaindiff.cli:main"

[tool.setuptools]
packages = ["domaindiff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["domaindiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
